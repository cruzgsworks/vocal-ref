# Apache Reverse Proxy for Vocal Reference Generator
# Add this to your Virtualmin site's Apache config (before the closing </VirtualHost>)
# Path in Virtualmin: Services -> Configure Website -> Edit Directives

<IfModule mod_proxy.c>
    ProxyPass /vocal-ref http://127.0.0.1:5000
    ProxyPassReverse /vocal-ref http://127.0.0.1:5000
</IfModule>

# If you want to use a subdomain instead of a subdirectory,
# create a separate virtual host and use:
#
# <VirtualHost *:80>
#     ServerName vocal.cruzgsworks.com
#     ProxyPass / http://127.0.0.1:5000/
#     ProxyPassReverse / http://127.0.0.1:5000/
# </VirtualHost>
